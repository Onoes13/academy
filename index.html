<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia DAW</title>
<style>
:root{--bg:#f4f3fa;--card:#fff;--tx:#1f1b2e;--mut:#6b6880;--pri:#6c4ce0;--ok:#1f9d55;--ko:#d64545;--bd:#e2e0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--card:#201d2e;--tx:#eeecf7;--mut:#a09cb8;--pri:#9a82ff;--ok:#3ccf7e;--ko:#ff6b6b;--bd:#35314a}}
:root[data-theme="dark"]{--bg:#15131f;--card:#201d2e;--tx:#eeecf7;--mut:#a09cb8;--pri:#9a82ff;--ok:#3ccf7e;--ko:#ff6b6b;--bd:#35314a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;text-align:center;color:var(--pri);margin:8px 0 16px}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:10px 0 6px}
select,button{width:100%;font:inherit;padding:13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer;font-weight:600}
button.p{background:var(--pri);color:#fff;border-color:var(--pri);margin-top:14px}
button.p:disabled{opacity:.45}
button.s{margin-top:10px}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.bar div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--mut)}
.bar b{display:block;font-size:22px;color:var(--tx)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.acts button{padding:10px 4px;font-size:13px}
.q{font-size:17px;font-weight:600;margin:0 0 12px;line-height:1.35}
.opt{text-align:left;margin-bottom:8px;font-weight:500}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.mut{color:var(--mut);font-size:13px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
.hide{display:none}
.del{width:auto;padding:4px 9px;font-size:13px;color:var(--ko)}
</style>
</head>
<body>
<main>
<h1>Academia DAW</h1>

<section id="menu" class="card">
  <h2>Configura tu Test</h2>
  <label for="asig">Asignatura:</label>
  <select id="asig"></select>
  <label for="tema">Tema:</label>
  <select id="tema" disabled><option>-- Selecciona primero la asignatura --</option></select>
  <button class="p" id="start" disabled>Comenzar Test</button>
  <button class="s" id="stats">📊 Ver mis Estadísticas</button>
</section>

<section id="quiz" class="hide">
  <div class="bar">
    <div><b id="nota">0.0</b>Nota</div>
    <div><b id="ac">0</b>Aciertos</div>
    <div><b id="fa">0</b>Fallos</div>
  </div>
  <div class="acts">
    <button id="salir">🏠 Salir</button>
    <button id="term">⏹️ Terminar</button>
    <button id="reini">🔄 Reiniciar</button>
  </div>
  <div class="card">
    <p class="mut" id="prog"></p>
    <p class="q" id="q"></p>
    <div id="opts"></div>
    <button class="p hide" id="next">Siguiente</button>
  </div>
</section>

<section id="hist" class="hide card">
  <h2>Tu Historial de Progreso</h2>
  <div class="wrap">
    <table>
      <thead><tr><th>Fecha</th><th>Test</th><th>Resumen</th><th>Nota</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <button class="s" id="back">🏠 Volver al Menú</button>
</section>
</main>

<script>
// ✏️ EDITA AQUÍ tus asignaturas, temas y preguntas.
// Formato: pregunta, opciones y c = índice (empezando en 0) de la correcta.
const DATA = {
  "Programación": {
    "Tema 1 – Java básico": [
      {q:"¿Qué palabra clave declara una constante en Java?", o:["const","final","static","let"], c:1},
      {q:"¿Cuál es el tipo de dato para números decimales de doble precisión?", o:["float","int","double","long"], c:2},
      {q:"¿Cómo se llama el método principal de una aplicación Java?", o:["start","run","main","init"], c:2}
    ]
  },
  "Bases de Datos": {
    "Tema 1 – SQL": [
      {q:"¿Qué sentencia se usa para consultar datos?", o:["INSERT","SELECT","UPDATE","DROP"], c:1},
      {q:"¿Qué cláusula filtra filas?", o:["WHERE","ORDER BY","GROUP BY","JOIN"], c:0},
      {q:"¿Qué restricción identifica de forma única cada fila?", o:["FOREIGN KEY","UNIQUE NULL","PRIMARY KEY","CHECK"], c:2}
    ]
  },
  "Lenguajes de Marcas": {
    "Tema 1 – HTML": [
      {q:"¿Qué etiqueta define un enlace?", o:["<link>","<a>","<href>","<url>"], c:1},
      {q:"¿Qué etiqueta es la de mayor nivel de encabezado?", o:["<h6>","<head>","<h1>","<header>"], c:2}
    ]
  },
  "Desarrollo Web en Entorno Cliente": {
    "Tema 1": [
      {q:"¿Qué lenguaje de marcado se utiliza para estructurar el contenido de una página web?", o:["JSON", "JavaScript", "HTML", "CSS"], c:2},
      {q:"¿Qué diferencia básica existe entre HTML y JavaScript?", o:["HTML estructura contenido y JavaScript añade comportamiento.", "JavaScript estructura contenido y HTML ejecuta lógica.", "Ambos son hojas de estilo.", "Ambos son formatos de datos."], c:0},
      {q:"¿Qué tecnología controla principalmente la presentación visual de una página web?", o:["JSON", "Tcl", "CSS", "HTML"], c:2},
      {q:"¿Qué diferencia básica existe entre CSS y JavaScript?", o:["CSS define presentación y JavaScript comportamiento.", "CSS gestiona la base de datos y JavaScript el servidor.", "Ambos son formatos de intercambio.", "Ambos son lenguajes de marcado."], c:0},
      {q:"¿Qué combinación permite crear una página estructurada, con estilos e interacción del lado cliente?", o:["Java, PHP y DNS", "SQL, FTP y SMTP", "HTML, CSS y JavaScript", "JSON, XML y FTP"], c:2},
      {q:"¿Qué objetivo persigue HTML5 en el desarrollo de aplicaciones web modernas?", o:["Eliminar CSS.", "Mejorar las capacidades y la experiencia web, incluido el uso móvil.", "Sustituir todos los lenguajes de programación.", "Eliminar JavaScript."], c:1},
      {q:"¿Qué lenguaje se utiliza para crear programas que realizan acciones dentro de una página web?", o:["JavaScript", "Python", "Ruby", "PHP"], c:0},
      {q:"¿Qué ventaja ofrece colocar JavaScript en un archivo externo?", o:["Impide compartir código entre páginas.", "Obliga a duplicar el script.", "Elimina la necesidad de HTML.", "Facilita la reutilización y mantiene el HTML más limpio."], c:3},
      {q:"¿Qué lenguaje de scripting se ha utilizado para desarrollar prototipos y aplicaciones de script?", o:["SQL", "CSS", "Tcl", "HTML"], c:2},
      {q:"¿Qué característica distingue a los lenguajes de scripting frente a los compilados?", o:["Generan siempre código máquina antes de ejecutarse.", "Se ejecutan mediante un intérprete.", "Solo pueden ejecutarse en servidores.", "No pueden interactuar con páginas web."], c:1},
      {q:"¿Qué tecnología permite actualizar partes de una página sin recargarla completamente?", o:["HTML5", "AJAX", "XML", "CSS"], c:1},
      {q:"¿Qué ventaja aporta AJAX a la experiencia del usuario?", o:["Elimina la comunicación con el servidor.", "Sustituye a HTML.", "Obliga a recargar toda la página.", "Reduce las recargas completas al actualizar partes de la página."], c:3},
      {q:"¿Qué formato de datos es habitual para intercambiar información entre cliente y servidor?", o:["XHTML", "JSON", "CSS", "Tcl"], c:1},
      {q:"¿Qué modelo divide el trabajo entre un cliente que solicita servicios y un servidor que responde?", o:["Cliente-servidor", "Modelo sin red", "Peer-to-peer exclusivamente", "Monolítico puro"], c:0},
      {q:"¿Qué componente inicia normalmente una petición en el modelo cliente-servidor?", o:["El cliente", "El servidor", "La base de datos", "El depurador"], c:0},
      {q:"¿Qué componente procesa las solicitudes y devuelve resultados en el modelo cliente-servidor?", o:["El cliente", "El navegador exclusivamente", "El servidor", "El editor"], c:2},
      {q:"¿Qué ventaja aporta JSON en aplicaciones cliente-servidor?", o:["Sustituye la presentación CSS.", "Representa datos de forma ligera para intercambiarlos.", "Ejecuta código en el navegador.", "Compila JavaScript."], c:1},
      {q:"¿Qué cambio favoreció la expansión del modelo cliente-servidor con la llegada de los PC?", o:["La distribución de carga entre cliente y servidor.", "El abandono de las redes.", "La centralización total en mainframes.", "La desaparición de interfaces gráficas."], c:0},
      {q:"¿Qué arquitectura permite acceder a información desde clientes de distintas plataformas?", o:["Solo peer-to-peer", "Monolítica", "Sin red", "Cliente-servidor"], c:3},
      {q:"¿Qué característica de Vue.js permite incorporarlo gradualmente a un proyecto?", o:["Su enfoque progresivo.", "El uso exclusivo de XML.", "La ejecución solo en servidor.", "La ausencia de componentes."], c:0},
      {q:"¿Qué framework se describe habitualmente como progresivo porque puede incorporarse de forma gradual?", o:["XHTML", "Tcl", "Flash", "Vue.js"], c:3},
      {q:"¿Qué ventaja principal ofrecía jQuery en muchos desarrollos web?", o:["Reemplazar por completo JavaScript.", "Eliminar la necesidad de programación.", "Crear bases de datos.", "Simplificar el código y las diferencias de compatibilidad entre navegadores."], c:3},
      {q:"¿Qué problema intentaban resolver librerías como jQuery?", o:["La falta de bases de datos.", "La compresión de imágenes.", "Las diferencias de comportamiento entre navegadores.", "La ausencia de servidores web."], c:2},
      {q:"¿Qué framework de interfaz utiliza un DOM virtual para actualizar la interfaz eficientemente?", o:["Flash", "React", "Tcl", "jQuery"], c:1},
      {q:"¿Qué característica de React contribuye a reutilizar partes de una interfaz?", o:["Los archivos CSS externos exclusivamente.", "Los componentes.", "Los registros DNS.", "Las sesiones FTP."], c:1},
      {q:"¿Qué tecnología permite manipular dinámicamente elementos de una página mediante JavaScript?", o:["SQL", "FTP", "El DOM", "SMTP"], c:2},
      {q:"¿Qué objetivo tiene un depurador de JavaScript?", o:["Gestionar versiones del proyecto.", "Localizar y corregir errores del código.", "Crear bases de datos.", "Diseñar hojas de estilo."], c:1},
      {q:"¿Qué herramienta permite detectar y analizar errores durante la ejecución del código?", o:["Editor de texto", "Depurador", "Generador de estilos", "Controlador de versiones"], c:1},
      {q:"¿Qué tipo de herramienta registra cambios y facilita trabajar con distintas versiones del código?", o:["Control de versiones.", "Generador de estilos.", "Depurador.", "Editor de texto."], c:0},
      {q:"¿Qué ventaja aporta un sistema de control de versiones en un proyecto web?", o:["Ejecuta automáticamente JavaScript.", "Elimina la necesidad de código.", "Facilita la colaboración y el seguimiento de cambios.", "Sustituye el depurador."], c:2},
      {q:"¿Qué debe hacer un navegador si un script JavaScript tarda demasiado y consume recursos?", o:["Borrar la página.", "Cerrar siempre el sistema operativo.", "Avisar al usuario y permitir detenerlo.", "Convertir el script en CSS."], c:2},
      {q:"¿Qué limitación de seguridad impide normalmente que JavaScript acceda libremente a los archivos del equipo?", o:["La ausencia de funciones.", "El uso de CSS.", "La falta de variables.", "El aislamiento impuesto por el navegador."], c:3},
      {q:"¿Qué tecnología obsoleta compitió con JavaScript para añadir interactividad en páginas web?", o:["Flash", "AJAX", "CSS", "JSON"], c:0},
      {q:"¿Qué caracteriza un desarrollo web del lado cliente bien organizado?", o:["Mezcla todo el código sin criterio.", "Evita herramientas de depuración.", "Separa estructura, presentación y comportamiento usando tecnologías adecuadas.", "No utiliza control de versiones."], c:2},
      {q:"¿Qué aspecto debe adaptarse en aplicaciones utilizadas desde dispositivos móviles?", o:["Presentación y controles.", "Solo el nombre del dominio.", "Solo la base de datos.", "Únicamente el servidor."], c:0},
      {q:"¿Qué tecnología se encarga principalmente de la estructura de una interfaz Android tradicional?", o:["JavaScript", "HTML", "CSS", "XML"], c:3}
    ]
  }
};

const $ = id => document.getElementById(id);
const KEY = "academia-daw-hist";
let sel = null, qs = [], i = 0, ac = 0, fa = 0, locked = false;

function show(id){ ["menu","quiz","hist"].forEach(s => $(s).classList.toggle("hide", s !== id)); }
function loadHist(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function saveHist(r){ try{ const h = loadHist(); h.unshift(r); localStorage.setItem(KEY, JSON.stringify(h.slice(0,50))); }catch(e){} }
function shuffle(a){ a = a.slice(); for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }

// Menú
$("asig").innerHTML = '<option value="">-- Selecciona una asignatura --</option>' + Object.keys(DATA).map(a => `<option>${a}</option>`).join("");
$("asig").onchange = () => {
  const a = $("asig").value, t = $("tema");
  if(!a){ t.disabled = true; t.innerHTML = "<option>-- Selecciona primero la asignatura --</option>"; $("start").disabled = true; return; }
  t.disabled = false;
  t.innerHTML = '<option value="">-- Selecciona un tema --</option>' + Object.keys(DATA[a]).map(x => `<option>${x}</option>`).join("");
  $("start").disabled = true;
};
$("tema").onchange = () => { $("start").disabled = !$("tema").value; };

function begin(){
  sel = [$("asig").value, $("tema").value];
  qs = shuffle(DATA[sel[0]][sel[1]]).slice(0, 10); i = 0; ac = 0; fa = 0;
  show("quiz"); render();
}
function score(){
  const n = ac + fa;
  $("ac").textContent = ac; $("fa").textContent = fa;
  $("nota").textContent = n ? (ac / n * 10).toFixed(1) : "0.0";
}
function render(){
  if(i >= qs.length){ finish(); return; }
  locked = false; score();
  const q = qs[i];
  $("prog").textContent = `Pregunta ${i+1} de ${qs.length}`;
  $("q").textContent = q.q;
  $("next").classList.add("hide");
  $("opts").innerHTML = "";
  q.o.forEach((txt, k) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = txt;
    b.onclick = () => answer(k, b);
    $("opts").appendChild(b);
  });
}
function answer(k, btn){
  if(locked) return; locked = true;
  const c = qs[i].c, btns = $("opts").children;
  if(k === c){ ac++; btn.classList.add("ok"); } else { fa++; btn.classList.add("ko"); btns[c].classList.add("ok"); }
  score();
  $("next").textContent = i === qs.length - 1 ? "Ver resultado" : "Siguiente";
  $("next").classList.remove("hide");
}
$("next").onclick = () => { i++; render(); };

function finish(){
  const n = ac + fa;
  if(n){
    saveHist({d: new Date().toLocaleDateString("es-ES"), t: sel.join(" · "), r: `${ac} ✔ / ${fa} ✘`, n: (ac / n * 10).toFixed(1)});
  }
  showHist();
}
function showHist(){
  const h = loadHist();
  $("rows").innerHTML = h.length
    ? h.map((r, k) => `<tr><td>${r.d}</td><td>${r.t}</td><td>${r.r}</td><td><b>${r.n}</b></td><td><button class="del" data-i="${k}">🗑️</button></td></tr>`).join("")
    : '<tr><td colspan="5" class="mut">Aún no hay tests.</td></tr>';
  show("hist");
}

$("start").onclick = begin;
$("reini").onclick = begin;
$("salir").onclick = () => show("menu");
$("term").onclick = finish;
$("stats").onclick = showHist;
$("back").onclick = () => show("menu");
$("rows").onclick = e => {
  const b = e.target.closest(".del"); if(!b) return;
  if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "¿Borrar?"; setTimeout(() => { b.dataset.sure = ""; b.textContent = "🗑️"; }, 3000); return; }
  const h = loadHist(); h.splice(+b.dataset.i, 1);
  try{ localStorage.setItem(KEY, JSON.stringify(h)); }catch(err){}
  showHist();
};
</script>
</body>
</html>
