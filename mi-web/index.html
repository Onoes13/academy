<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Academia DAW</title>
    <style>
        :root{--bg:#f4f3fa;--card:#fff;--tx:#1f1b2e;--mut:#6b6880;--pri:#6c4ce0;--ok:#1f9d55;--ko:#d64545;--bd:#e2e0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--card:#201d2e;--tx:#eeecf7;--mut:#a09cb8;--pri:#9a82ff;--ok:#3ccf7e;--ko:#ff6b6b;--bd:#35314a}}
        :root[data-theme="dark"]{--bg:#15131f;--card:#201d2e;--tx:#eeecf7;--mut:#a09cb8;--pri:#9a82ff;--ok:#3ccf7e;--ko:#ff6b6b;--bd:#35314a}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
        main{max-width:560px;margin:0 auto;padding:16px}
        h1{font-size:24px;text-align:center;color:var(--pri);margin:8px 0 16px}
        h2{font-size:18px;margin:4px 0 12px}
        .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
        label{display:block;font-weight:600;margin:10px 0 6px}
        select,button{width:100%;font:inherit;padding:13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
        button{cursor:pointer;font-weight:600}
        button.p{background:var(--pri);color:#fff;border-color:var(--pri);margin-top:14px}
        button.p:disabled{opacity:.45}
        button.s{margin-top:10px}
        .bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
        .bar div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--mut)}
        .bar b{display:block;font-size:22px;color:var(--tx)}
        .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
        .acts button{padding:10px 4px;font-size:13px}
        .q{font-size:17px;font-weight:600;margin:0 0 12px;line-height:1.35}
        .opt{text-align:left;margin-bottom:8px;font-weight:500}
        .opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
        .opt.ko{background:var(--ko);border-color:var(--ko);color:#fff}
        .mut{color:var(--mut);font-size:13px}
        .wrap{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
        .hide{display:none}
        .del{width:auto;padding:4px 9px;font-size:13px;color:var(--ko)}
    </style>
</head>
<body>
<main>
    <h1>Academia DAW</h1>

    <section id="menu" class="card">
        <h2>Configura tu Test</h2>
        <label for="asig">Asignatura:</label>
        <select id="asig"></select>
        <label for="tema">Tema:</label>
        <select id="tema" disabled><option>-- Selecciona primero la asignatura --</option></select>
        <button class="p" id="start" disabled>Comenzar Test</button>
        <button class="s" id="stats">📊 Ver mis Estadísticas</button>
    </section>

    <section id="quiz" class="hide">
        <div class="bar">
            <div><b id="nota">0.0</b>Nota</div>
            <div><b id="ac">0</b>Aciertos</div>
            <div><b id="fa">0</b>Fallos</div>
        </div>
        <div class="acts">
            <button id="salir">🏠 Salir</button>
            <button id="term">⏹️ Terminar</button>
            <button id="reini">🔄 Reiniciar</button>
        </div>
        <div class="card">
            <p class="mut" id="prog"></p>
            <p class="q" id="q"></p>
            <div id="opts"></div>
            <button class="p hide" id="next">Siguiente</button>
        </div>
    </section>

    <section id="hist" class="hide card">
        <h2>Tu Historial de Progreso</h2>
        <div class="wrap">
            <table>
                <thead><tr><th>Fecha</th><th>Test</th><th>Resumen</th><th>Nota</th><th></th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
        <button class="s" id="back">🏠 Volver al Menú</button>
    </section>
</main>

    const $ = id => document.getElementById(id);
    const KEY = "academia-daw-hist";
    let sel = null, qs = [], i = 0, ac = 0, fa = 0, locked = false;

    function show(id){ ["menu","quiz","hist"].forEach(s => $(s).classList.toggle("hide", s !== id)); }
    function loadHist(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
    function saveHist(r){ try{ const h = loadHist(); h.unshift(r); localStorage.setItem(KEY, JSON.stringify(h.slice(0,50))); }catch(e){} }
    function shuffle(a){ a = a.slice(); for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }

    // Menú
    $("asig").innerHTML = '<option value="">-- Selecciona una asignatura --</option>' + Object.keys(DATA).map(a => `<option>${a}</option>`).join("");
    $("asig").onchange = () => {
        const a = $("asig").value, t = $("tema");
        if(!a){ t.disabled = true; t.innerHTML = "<option>-- Selecciona primero la asignatura --</option>"; $("start").disabled = true; return; }
        t.disabled = false;
        t.innerHTML = '<option value="">-- Selecciona un tema --</option>' + Object.keys(DATA[a]).map(x => `<option>${x}</option>`).join("");
        $("start").disabled = true;
    };
    $("tema").onchange = () => { $("start").disabled = !$("tema").value; };

    function begin(){
        sel = [$("asig").value, $("tema").value];
        qs = shuffle(DATA[sel[0]][sel[1]]).slice(0, 10); i = 0; ac = 0; fa = 0;
        show("quiz"); render();
    }
    function score(){
        const n = ac + fa;
        $("ac").textContent = ac; $("fa").textContent = fa;
        $("nota").textContent = n ? (ac / n * 10).toFixed(1) : "0.0";
    }
    function render(){
        if(i >= qs.length){ finish(); return; }
        locked = false; score();
        const q = qs[i];
        $("prog").textContent = `Pregunta ${i+1} de ${qs.length}`;
        $("q").textContent = q.q;
        $("next").classList.add("hide");
        $("opts").innerHTML = "";
        q.o.forEach((txt, k) => {
            const b = document.createElement("button");
            b.className = "opt"; b.textContent = txt;
            b.onclick = () => answer(k, b);
            $("opts").appendChild(b);
        });
    }
    function answer(k, btn){
        if(locked) return; locked = true;
        const c = qs[i].c, btns = $("opts").children;
        if(k === c){ ac++; btn.classList.add("ok"); } else { fa++; btn.classList.add("ko"); btns[c].classList.add("ok"); }
        score();
        $("next").textContent = i === qs.length - 1 ? "Ver resultado" : "Siguiente";
        $("next").classList.remove("hide");
    }
    $("next").onclick = () => { i++; render(); };

    function finish(){
        const n = ac + fa;
        if(n){
            saveHist({d: new Date().toLocaleDateString("es-ES"), t: sel.join(" · "), r: `${ac} ✔ / ${fa} ✘`, n: (ac / n * 10).toFixed(1)});
        }
        showHist();
    }
    function showHist(){
        const h = loadHist();
        $("rows").innerHTML = h.length
            ? h.map((r, k) => `<tr><td>${r.d}</td><td>${r.t}</td><td>${r.r}</td><td><b>${r.n}</b></td><td><button class="del" data-i="${k}">🗑️</button></td></tr>`).join("")
            : '<tr><td colspan="5" class="mut">Aún no hay tests.</td></tr>';
        show("hist");
    }

    $("start").onclick = begin;
    $("reini").onclick = begin;
    $("salir").onclick = () => show("menu");
    $("term").onclick = finish;
    $("stats").onclick = showHist;
    $("back").onclick = () => show("menu");
    $("rows").onclick = e => {
        const b = e.target.closest(".del"); if(!b) return;
        if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "¿Borrar?"; setTimeout(() => { b.dataset.sure = ""; b.textContent = "🗑️"; }, 3000); return; }
        const h = loadHist(); h.splice(+b.dataset.i, 1);
        try{ localStorage.setItem(KEY, JSON.stringify(h)); }catch(err){}
        showHist();
    };
</script>
</body>
</html>
